<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Gaussian Splat Renderer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background-color: #000; color: #fff; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-container { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        #loading-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5em; display: none; }
        input, button { margin: 5px; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
        }
    }
    </script>
    <div id="ui-container">
        <label for="splat-file">Load .PLY Splat:</label>
        <input type="file" id="splat-file" accept=".ply">
        <button id="fullscreen-btn">Fullscreen</button>
    </div>
    <div id="loading-msg">Select a .ply file to begin</div>
    <canvas id="splat-canvas"></canvas>
    <script type="module" src="main.js"></script>
</body>
</html>
